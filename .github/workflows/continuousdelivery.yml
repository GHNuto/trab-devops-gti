name: Continuos Delivery
on:
  push:
    branches:
      - main


jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Simulando continuous delivery
        uses: actions/upload-artifact@v7
        with:
          name: projetozipado.zip
          path: |
            '**.py'
            README.md


